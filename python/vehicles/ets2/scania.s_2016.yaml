# Scania S (2016) -- SCS' own truck, accessory-based paint job system.
# The unit names below are the game's own, from def/vehicle/truck/scania.s_2016/.
vehicle:
  path: scania.s_2016
  name: Scania S
  game: ets2
  type: truck
  author: SCS
  mod: false
  alternate_uvset: false
  separate_paintjobs: true
  template_size: [4096, 4096]

  cabins:
    a:
      name: Cabin A (High Roof)
      units: [highline]
    b:
      name: Cabin B (Normal Roof)
      units: [normal]
    "8":
      name: Cabin 8x4 (High Roof)
      units: [highline_8x4]

  accessories:
    Rear Exhaust: [exhaust_m.mg01]
    Front Logo: [f_logo.painted]
    Mirrors: [f_mirror.painted, mirror.painted, mirror.painted_f, s_mirror.painted]
    Sun Visor:
      [sunshld.stock, sunshld.sunshld_01, sunshld.sunshld_04, sunshld.sunshld_05,
       sunshld.sunshld_06]
    Rear Bumper:
      [r_bumper.duty_p, r_bumper.mg01, r_bumper.mg03, r_bumper.mg04, r_bumper.stock_p]
    Chassis Cover: [r_chs_cover.4x2_p, r_chs_cover.6xn_p, r_chs_cover.6xnl_p]
