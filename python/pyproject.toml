[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euro-creator"
version = "0.1.0"
description = "Turn a Blender truck and a painted texture into a ready-to-install ETS2/ATS paintjob mod"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "Pillow>=9.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
euro-creator = "eurocreator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eurocreator = ["blender_scripts/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
